name: Hosted CI

on:
  push:
    branches: [main, algo/ci]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CARGO_TERM_COLOR: always
      SQLX_OFFLINE: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev pkg-config libdbus-1-dev libssl-dev libgtk-3-dev libwebkit2gtk-4.1-dev fonts-noto-cjk fonts-unifont
      # Existing baseline-wide formatter drift is tracked in hyper#263.
      - name: Rust formatting check (tracked exception)
        run: cargo fmt --all -- --check
        continue-on-error: true
      - run: cargo clippy --workspace --all-targets
      - name: Workspace tests
        run: cargo test --workspace --no-fail-fast
